for(let z of [-3.8,-1.5,.8,3.1]){let l=new THREE.PointLight(0xffb96c,10,4.5);l.position.set(0,2.85,z);scene.add(l);let bulb=new THREE.Mesh(new THREE.SphereGeometry(.07,12,8),new THREE.MeshBasicMaterial({color:0xffe1aa}));bulb.position.copy(l.position);scene.add(bulb)}
let yaw=0,pitch=0,down=false,lastX=0,lastY=0,dist=0;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down)return;yaw-=(e.clientX-lastX)*.004;pitch=Math.max(-1.53,Math.min(1.53,pitch-(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('wheel',e=>{camera.fov=Math.max(40,Math.min(95,camera.fov+e.deltaY*.04));camera.updateProjectionMatrix()},{passive:true});let pinch=null;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch!==null){camera.fov=Math.max(40,Math.min(95,camera.fov+(pinch-d)*.08));camera.updateProjectionMatrix()}pinch=d}}, {passive:true});canvas.addEventListener('touchend',()=>pinch=null);document.getElementById('plus').onclick=()=>{camera.fov=Math.max(40,camera.fov-9);camera.updateProjectionMatrix()};document.getElementById('minus').onclick=()=>{camera.fov=Math.min(95,camera.fov+9);camera.updateProjectionMatrix()};document.getElementById('reset').onclick=()=>{yaw=0;pitch=0;camera.fov=75;camera.updateProjectionMatrix()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}animate();
